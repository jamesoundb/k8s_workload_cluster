---
# Kubernetes Worker Node Reset Playbook
# Cleanly removes workers from cluster and resets nodes to pre-join state

- name: Reset worker nodes to clean state
  hosts: workers
  become: true
  gather_facts: false
  serial: 1  # Reset workers one at a time for safety
  
  tasks:
    - name: Check if worker node is reachable
      ping:
      register: ping_result
      ignore_errors: true
      
    - name: Skip unreachable workers
      meta: end_host
      when: ping_result is failed
      
    - name: Display reset target
      debug:
        msg: "Resetting worker node {{ inventory_hostname }} ({{ ansible_host }}) to clean state"

# Phase 1: Graceful cluster removal
- name: Remove workers from Kubernetes cluster (from control plane)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    control_plane_host: "192.168.1.100"  # VIP address
    ssh_key_path: "~/.ssh/k8s_pi"
  
  tasks:
    - name: Get list of worker nodes to remove
      set_fact:
        worker_nodes: "{{ groups['workers'] | default([]) }}"
        
    - name: Display workers being removed from cluster
      debug:
        msg: "Removing workers from cluster: {{ worker_nodes }}"
        
    - name: Drain worker nodes from control plane
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no k8s@{{ control_plane_host }} \
        "kubectl drain {{ hostvars[item]['inventory_hostname'] }} --ignore-daemonsets --delete-emptydir-data --force --timeout=300s"
      loop: "{{ worker_nodes }}"
      ignore_errors: true
      when: worker_nodes | length > 0
      
    - name: Delete worker nodes from cluster
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no k8s@{{ control_plane_host }} \
        "kubectl delete node {{ hostvars[item]['inventory_hostname'] }}"
      loop: "{{ worker_nodes }}"
      ignore_errors: true
      when: worker_nodes | length > 0

# Phase 2: Worker node cleanup
- name: Clean worker nodes completely
  hosts: workers
  become: true
  gather_facts: false
  serial: 1
  
  tasks:
    - name: Check if worker is reachable (retry)
      ping:
      register: ping_result
      ignore_errors: true
      
    - name: Skip unreachable workers
      meta: end_host
      when: ping_result is failed

    # Step 1: Stop all services gracefully
    - name: Stop kubelet service
      systemd:
        name: kubelet
        state: stopped
        enabled: false
      ignore_errors: true
      
    - name: Stop containerd service
      systemd:
        name: containerd
        state: stopped
      ignore_errors: true

    # Step 2: Reset Kubernetes worker completely
    - name: Run kubeadm reset on worker
      shell: kubeadm reset -f
      ignore_errors: true
      
    - name: Remove Kubernetes worker configuration files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /var/lib/kubelet
        - /etc/cni/net.d
        - /opt/cni/bin
        - /var/lib/dockershim
        - /var/run/kubernetes
        - /var/lib/cni
        - /etc/systemd/system/kubelet.service.d
        - /etc/systemd/system/multi-user.target.wants/kubelet.service
        
    - name: Remove worker kubeconfig files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/home/{{ ansible_user }}/.kube"
        - /root/.kube
      ignore_errors: true

    # Step 3: Remove Kubernetes packages (worker-specific)
    - name: Unhold Kubernetes packages
      shell: apt-mark unhold kubeadm kubelet kubectl
      ignore_errors: true
      
    - name: Remove Kubernetes packages from worker
      apt:
        name:
          - kubeadm
          - kubelet  
          - kubectl
        state: absent
        purge: true
        allow_change_held_packages: true
      ignore_errors: true
      
    - name: Remove containerd packages
      apt:
        name:
          - containerd
          - containerd.io
          - runc
        state: absent
        purge: true
      ignore_errors: true

    # Step 4: Clean container runtime completely
    - name: Stop all containers on worker
      shell: |
        if command -v crictl >/dev/null 2>&1; then
          crictl stop $(crictl ps -q) 2>/dev/null || true
          crictl rm $(crictl ps -aq) 2>/dev/null || true
          crictl rmi --prune 2>/dev/null || true
        fi
      ignore_errors: true
      
    - name: Unmount containerd filesystems
      shell: |
        # Unmount any busy container filesystems
        for mount in $(mount | grep containerd | awk '{print $3}' | sort -r); do
          umount -l "$mount" 2>/dev/null || true
        done
        
        # Force unmount remaining containerd mounts
        umount -l /run/containerd 2>/dev/null || true
        umount -l /var/lib/containerd 2>/dev/null || true
      ignore_errors: true
      
    - name: Remove container runtime directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/containerd
        - /var/lib/docker
        - /run/containerd
        - /run/docker
        - /etc/containerd
        - /etc/docker
      ignore_errors: true

    # Step 5: Network cleanup (worker-specific)
    - name: Remove CNI network interfaces on worker
      shell: |
        # Remove flannel interfaces
        ip link delete flannel.1 2>/dev/null || true
        ip link delete cni0 2>/dev/null || true
        ip link delete docker0 2>/dev/null || true
        
        # Remove any veth pairs from pods
        for interface in $(ip link show type veth | grep -o 'veth[^:@]*'); do
          ip link delete "$interface" 2>/dev/null || true
        done
        
        # Clean bridge interfaces
        for bridge in $(ip link show type bridge | grep -o 'br-[^:@]*'); do
          ip link delete "$bridge" 2>/dev/null || true
        done
      ignore_errors: true
      
    - name: Flush iptables rules (worker-specific)
      shell: |
        # Save current rules first (optional)
        iptables-save > /tmp/iptables-backup-$(date +%Y%m%d-%H%M%S) || true
        
        # Flush all rules
        iptables -F
        iptables -X
        iptables -t nat -F
        iptables -t nat -X
        iptables -t mangle -F
        iptables -t mangle -X
        iptables -t raw -F
        iptables -t raw -X
        
        # Reset policies to ACCEPT
        iptables -P INPUT ACCEPT
        iptables -P FORWARD ACCEPT
        iptables -P OUTPUT ACCEPT
      ignore_errors: true

    # Step 6: Clean system configuration
    - name: Remove Kubernetes systemd services
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/kubelet.service
        - /etc/systemd/system/containerd.service
        - /lib/systemd/system/kubelet.service
        - /usr/lib/systemd/system/kubelet.service
      ignore_errors: true
      
    - name: Remove worker-specific kernel modules configuration
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/modules-load.d/k8s.conf
        - /etc/modules-load.d/containerd.conf
        - /etc/sysctl.d/k8s.conf
        - /etc/sysctl.d/99-kubernetes-cri.conf

    # Step 7: Package cleanup
    - name: Remove Kubernetes apt sources
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/kubernetes.list
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - /usr/share/keyrings/kubernetes-archive-keyring.gpg
        - /etc/apt/sources.list.d/docker.list
      ignore_errors: true
      
    - name: Update apt cache after cleanup
      apt:
        update_cache: true
      ignore_errors: true
      
    - name: Autoremove unused packages
      apt:
        autoremove: true
        autoclean: true
      ignore_errors: true

    # Step 8: System reload and verification
    - name: Reload systemd daemon
      systemd:
        daemon_reload: true
        
    - name: Reset failed systemd services
      shell: systemctl reset-failed
      ignore_errors: true

    - name: Kill remaining Kubernetes processes on worker
      shell: |
        # Kill worker-specific processes
        pkill -f "kubelet" || true
        pkill -f "kube-proxy" || true
        pkill -f "containerd-shim" || true
        pkill -f "runc" || true
        
        # Wait for graceful termination
        sleep 5
        
        # Force kill stubborn processes
        pkill -9 -f "kubelet" || true
        pkill -9 -f "kube-proxy" || true
        pkill -9 -f "containerd-shim" || true
        pkill -9 -f "runc" || true
      ignore_errors: true
      
    - name: Verify worker cleanup
      shell: |
        echo "=== Worker Node Cleanup Verification ==="
        echo "Worker: {{ inventory_hostname }} ({{ ansible_host }})"
        echo ""
        echo "Kubelet status:"
        systemctl status kubelet --no-pager -l 2>/dev/null || echo "✅ kubelet not found (good)"
        echo ""
        echo "Containerd status:"
        systemctl status containerd --no-pager -l 2>/dev/null || echo "✅ containerd not found (good)"
        echo ""
        echo "Remaining Kubernetes processes:"
        ps aux | grep -E "(kube|containerd|runc)" | grep -v grep || echo "✅ No Kubernetes processes (good)"
        echo ""
        echo "Port check (kubelet 10250 should be free):"
        netstat -tulpn | grep ":10250" || echo "✅ Kubelet port 10250 is free (good)"
        echo ""
        echo "Remaining Kubernetes files:"
        find /etc /var/lib -name "*kube*" 2>/dev/null | head -5 || echo "✅ No major Kubernetes files found"
        echo ""
        echo "Network interfaces:"
        ip link show | grep -E "(flannel|cni|docker|veth|br-)" || echo "✅ No container network interfaces (good)"
        echo ""
        echo "Disk space after cleanup:"
        df -h / | tail -1
      register: worker_verification
      ignore_errors: true
      
    - name: Display worker verification results
      debug:
        var: worker_verification.stdout_lines

    - name: Worker reset complete
      debug:
        msg: |
          ✅ Worker node {{ inventory_hostname }} reset complete!
          
          Worker cleanup summary:
          - Removed from Kubernetes cluster via control plane
          - All Kubernetes services stopped and removed
          - Container runtime completely cleaned
          - Network interfaces and iptables reset
          - System packages removed and cleaned
          
          The worker is now ready for:
          - Fresh deployment via join-workers.yml
          - Manual reconfiguration
          - Template recreation (if needed)
          
          Next steps:
          1. Verify control plane shows node as removed:
             kubectl get nodes
          2. Reboot worker for completely clean state (recommended)
          3. Re-deploy: ansible-playbook -i generated_inventory.yml join-workers.yml

# Phase 3: Verification from control plane
- name: Final verification from control plane
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    control_plane_host: "192.168.1.100"
    ssh_key_path: "~/.ssh/k8s_pi"
    
  tasks:
    - name: Verify workers removed from cluster
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no k8s@{{ control_plane_host }} \
        "kubectl get nodes -o wide"
      register: cluster_nodes
      ignore_errors: true
      
    - name: Display final cluster state
      debug:
        msg: |
          ✅ Worker reset operation complete!
          
          Final cluster state:
          {{ cluster_nodes.stdout }}
          
          Summary:
          - Workers drained and removed from cluster
          - Worker nodes cleaned and reset
          - Control plane cluster remains intact
          
          To re-add workers:
          ansible-playbook -i generated_inventory.yml join-workers.yml
      when: cluster_nodes is succeeded
      
    - name: Control plane verification failed
      debug:
        msg: |
          ⚠️  Could not verify cluster state from control plane
          
          This might be normal if:
          - Control plane is temporarily unavailable
          - SSH key needs updating
          - Network connectivity issues
          
          Manual verification:
          ssh -i ~/.ssh/k8s_pi k8s@192.168.1.100 "kubectl get nodes"
      when: cluster_nodes is failed