---
# Default variables for containerd role

# Containerd version
containerd_version: "1.7.28"

# CNI plugins version
cni_plugins_version: "1.3.0"

# Container network configuration
container_network_cidr: "10.88.0.0/16"

# Architecture detection for downloads
arch_map:
  "x86_64": "amd64"
  "aarch64": "arm64"
  "armv7l": "arm"

# Derived architecture for downloads
download_arch: "{{ arch_map[ansible_architecture] | default('amd64') }}"